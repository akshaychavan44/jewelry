services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loupe-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - DATABASE_URL=postgresql://loupe:loupe@db:5432/loupe
      - AUTH_TRUST_HOST=true
      - AUTH_SECRET=${AUTH_SECRET:-replace-with-openssl-rand-base64-33}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-replace-with-openssl-rand-base64-32}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: loupe-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: loupe
      POSTGRES_PASSWORD: loupe
      POSTGRES_DB: loupe
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loupe -d loupe"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
